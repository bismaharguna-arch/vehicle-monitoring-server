<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Vehicle Monitoring</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/refined.css') }}" rel="stylesheet">

  <style>
    /* Shell & card mengikuti login.html (halaman standalone, style tidak dishare) */
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 20% 0%, rgba(79, 70, 229, 0.06), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(5, 150, 105, 0.05), transparent 45%),
        var(--vm-bg);
    }

    .vm-login-shell {
      width: 100%;
      max-width: 400px;
    }

    .vm-login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .vm-login-brand-text {
      font-size: 1rem;
      font-weight: 600;
      color: var(--vm-text-primary);
      letter-spacing: -0.01em;
    }

    .vm-login-card {
      background: var(--vm-glass-bg);
      -webkit-backdrop-filter: var(--vm-glass-blur);
      backdrop-filter: var(--vm-glass-blur);
      border: 1px solid var(--vm-glass-border);
      border-radius: var(--vm-radius-lg);
      box-shadow: var(--vm-shadow-lg), var(--vm-glass-shine);
      padding: 2rem;
    }

    .vm-login-title {
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--vm-text-primary);
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }

    .vm-login-sub {
      font-size: 0.8125rem;
      color: var(--vm-text-muted);
      margin: 0 0 1.5rem;
    }

    .vm-login-error {
      background: var(--vm-danger-soft);
      color: var(--vm-danger);
      border: 1px solid rgba(220, 38, 38, 0.18);
      border-radius: var(--vm-radius-sm);
      padding: 0.6rem 0.8rem;
      font-size: 0.8125rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .vm-login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--vm-text-muted);
    }

    .vm-pw-toggle {
      background: transparent;
      border: none;
      color: var(--vm-text-muted);
      padding: 0 0.7rem;
      cursor: pointer;
      transition: color var(--vm-dur-fast) var(--vm-ease);
    }
    .vm-pw-toggle:hover { color: var(--vm-text-primary); }

    .vm-login-register {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8125rem;
      color: var(--vm-text-muted);
    }
    .vm-login-register a {
      color: var(--vm-accent);
      font-weight: 600;
      text-decoration: none;
    }
    .vm-login-register a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="vm-login-shell" x-data="{ showPw: false }">

    <div class="vm-login-brand">
      <span class="vm-login-brand-text">Vehicle Monitoring</span>
    </div>

    <div class="vm-login-card">
      <h1 class="vm-login-title">Buat akun</h1>
      <p class="vm-login-sub">Akun baru berhak melihat dashboard pemantauan (hanya-lihat).</p>

      {% if error %}
      <div class="vm-login-error">
        <i class="ti ti-alert-circle"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.register') }}" autocomplete="on">
        <div class="vm-field">
          <label class="vm-label" for="vm-username">Username</label>
          <div class="vm-input-group">
            <span class="vm-input-icon"><i class="ti ti-user"></i></span>
            <input id="vm-username" name="username" type="text" class="vm-input"
                   placeholder="3-60 karakter" required autofocus
                   minlength="3" maxlength="60"
                   value="{{ username or '' }}"
                   autocomplete="username">
          </div>
        </div>

        <div class="vm-field">
          <label class="vm-label" for="vm-password">Password</label>
          <div class="vm-input-group">
            <span class="vm-input-icon"><i class="ti ti-lock"></i></span>
            <input id="vm-password" name="password" class="vm-input"
                   :type="showPw ? 'text' : 'password'"
                   placeholder="Minimal 4 karakter" required minlength="4"
                   autocomplete="new-password">
            <button type="button" class="vm-pw-toggle"
                    @click="showPw = !showPw"
                    :title="showPw ? 'Sembunyikan' : 'Tampilkan'">
              <i :class="showPw ? 'ti ti-eye-off' : 'ti ti-eye'"></i>
            </button>
          </div>
        </div>

        <div class="vm-field">
          <label class="vm-label" for="vm-password2">Konfirmasi Password</label>
          <div class="vm-input-group">
            <span class="vm-input-icon"><i class="ti ti-lock-check"></i></span>
            <input id="vm-password2" name="password2" class="vm-input"
                   :type="showPw ? 'text' : 'password'"
                   placeholder="Ulangi password" required minlength="4"
                   autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="vm-btn vm-btn--primary w-100" style="padding: 0.65rem;">
          <i class="ti ti-user-plus"></i> Daftar
        </button>
      </form>

      <div class="vm-login-register">
        Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a>
      </div>
    </div>

    <div class="vm-login-footer">
      Telkom University Project · &copy; 2026
    </div>
  </div>

  <script defer src="https://unpkg.com/alpinejs@3.13.10/dist/cdn.min.js"></script>
</body>
</html>
