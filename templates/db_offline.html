<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Offline — Vehicle Monitoring</title>
  <meta http-equiv="refresh" content="10">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/refined.css') }}" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 20% 0%, rgba(217, 119, 6, 0.06), transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(79, 70, 229, 0.05), transparent 45%),
        var(--vm-bg, #f4f6f9);
    }
    .vm-offline-card {
      max-width: 520px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
    }
    .vm-offline-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(217, 119, 6, 0.12);
      color: #d97706;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .5rem; color: #1f2937; }
    p  { color: #6b7280; margin: 0 0 1rem; line-height: 1.55; }
    .vm-hint { font-size: .85rem; color: #9ca3af; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: .85em; }
  </style>
</head>
<body>
  <div class="vm-offline-card">
    <div class="vm-offline-icon"><i class="ti ti-database-off"></i></div>
    <h1>Database sedang tidak tersedia</h1>
    <p>
      Server tidak bisa terhubung ke MySQL saat ini. Halaman akan otomatis di-refresh
      tiap 10 detik — coba pastikan MySQL (Laragon) sudah jalan.
    </p>
    <p class="vm-hint">
      Cek <code>DATABASE_URL</code> di <code>.env</code> kalau masalah berlanjut.
    </p>
  </div>
</body>
</html>
